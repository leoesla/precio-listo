<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Precio Listo - Compara precios de tecnología</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <!-- Barra de Navegación -->
    <header class="navbar">
        <div class="logo">
            <h1>PRECIO LISTO<span>✓</span></h1>
        </div>
        
        <div class="search-container">
            <input type="text" placeholder="Buscar productos (ej. Laptops, Celulares)..." id="searchInput">
            <button class="search-btn">🔍</button>
        </div>

        <div class="user-actions">
            <button class="login-btn" id="loginGoogleBtn">
                <img src="https://upload.wikimedia.org/wikipedia/commons/c/c1/Google_%22G%22_logo.svg" alt="Google Logo" width="16" style="vertical-align: middle; margin-right: 5px;">
                Iniciar sesión con Google
            </button>
        </div>
    </header>

    <!-- Contenido Principal -->
    <main class="container">
        <section class="hero-section">
            <h2>Compara. Encuentra. Ahorra.</h2>
            <p>Los mejores precios de tecnología en el Perú están aquí.</p>
        </section>
        
        <!-- Categorías -->
        <div class="categories">
            <button class="category-btn active">📱 Celulares</button>
            <button class="category-btn">💻 Laptops</button>
            <button class="category-btn">📺 TVs</button>
            <button class="category-btn">🎧 Accesorios</button>
        </div>

        <!-- Grilla de Productos -->
        <section class="products-grid">
            
            <!-- Tarjeta de Producto 1 -->
            <article class="product-card">
                <button class="fav-btn">🤍</button>
                <div class="product-image">
                    <!-- Usamos una imagen de muestra por ahora -->
                    <img src="https://placehold.co/400x400/eeeeee/333333?text=Foto+Celular" alt="Smartphone">
                </div>
                <h3 class="product-title">Smartphone Samsung Galaxy A54 5G</h3>
                <div class="prices">
                    <div class="price-item">
                        <span class="store">Falabella</span>
                        <span class="amount">S/ 1,399</span>
                    </div>
                    <div class="price-item">
                        <span class="store">Ripley</span>
                        <span class="amount">S/ 1,419</span>
                    </div>
                </div>
                <span class="badge">Mejor precio</span>
                <a href="#" target="_blank" class="store-btn">VER EN TIENDA</a>
            </article>

            <!-- Tarjeta de Producto 2 -->
            <article class="product-card">
                <button class="fav-btn">🤍</button>
                <div class="product-image">
                    <img src="https://placehold.co/400x400/eeeeee/333333?text=Foto+Laptop" alt="Laptop">
                </div>
                <h3 class="product-title">Laptop HP Pavilion 15.6" Intel Core i5</h3>
                <div class="prices">
                    <div class="price-item">
                        <span class="store">Curacao</span>
                        <span class="amount">S/ 2,499</span>
                    </div>
                    <div class="price-item">
                        <span class="store">Hiraoka</span>
                        <span class="amount">S/ 2,550</span>
                    </div>
                </div>
                <span class="badge">Mejor precio</span>
                <a href="#" target="_blank" class="store-btn">VER EN TIENDA</a>
            </article>

        </section>

    </main>
<!-- Botón flotante del Chatbot -->
    <div class="chatbot-floating">
        <button class="chat-btn">🤖 Precio Listo AI</button>
    </div>
</body>
</html>
