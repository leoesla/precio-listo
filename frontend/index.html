<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Precio Listo - Compara precios de tecnología</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <!-- Barra de Navegación -->
    <header class="navbar">
        <div class="logo">
            <img src="logo.png" alt="Logo Precio Listo" class="logo-img">
        </div>
        
        <div class="search-container">
            <input type="text" placeholder="Buscar productos (ej. Laptops, Celulares)..." id="searchInput">
            <button class="search-btn">🔍</button>
        </div>

        <div class="user-actions">
            <!-- Contenedor vacío para el botón oficial de Google -->
            <div id="googleBtnContainer"></div>
        </div>
    </header>

    <!-- Contenido Principal -->
    <main class="container">
        <section class="hero-section">
            <h2>Compara. Encuentra. Ahorra.</h2>
            <p>Los mejores precios de tecnología en el Perú están aquí.</p>
        </section>
        
        <!-- Categorías -->
        <div class="categories">
            <button class="category-btn active">📱 Celulares</button>
            <button class="category-btn">💻 Laptops</button>
            <button class="category-btn">📺 TVs</button>
            <button class="category-btn">🎧 Accesorios</button>
        </div>

        <!-- Grilla de Productos -->
        <section class="products-grid" id="contenedor-productos">
            <!-- Las tarjetas se inyectarán aquí automáticamente con JavaScript -->
        </section>

    </main>

    <!-- Script oficial de Google -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <!-- Script principal -->
    <script src="main.js"></script>

<!-- Botón flotante del Chatbot -->
    <div class="chatbot-floating">
        <button class="chat-btn">🤖 Precio Listo AI</button>
    </div>
</body>
</html>
